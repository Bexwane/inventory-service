# ─────────────────────────────────────────────────────────────
# enterprise-inventory — application configuration
# FIX: All secrets removed from this file entirely.
#      Real values are injected at runtime via environment
#      variables or a secrets manager (HashiCorp Vault / AWS SSM).
#      This file is safe to commit to git.
# ─────────────────────────────────────────────────────────────

spring:
  application:
    name: enterprise-inventory

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}               # no default — must be set explicitly
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: wms-hikari-pool

  jpa:
    hibernate:
      ddl-auto: validate                   # never create/update in production
    show-sql: false
    properties:
      hibernate:
        format_sql: false                  # only enable locally if debugging
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50                   # enables batch inserts for bulk ops
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    user: ${FLYWAY_USERNAME:${DB_USERNAME:postgres}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD}}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true           # exactly-once producer semantics

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never                 # prevents internal messages leaking to clients
    include-binding-errors: never

jwt:
  secret: ${JWT_SECRET:this_is_a_very_long_and_secure_default_secret_key_for_local_development_only_do_not_use_in_prod}                    # min 64 chars, generated via: openssl rand -base64 64
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}          # 1 hour access token
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}  # 24 hour refresh token

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.enterprise.inventory: INFO
    org.hibernate.SQL: OFF
    org.hibernate.type: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
app:
  api:
    base-path: /api/v1
    auth:
      base: /auth
      login: /login
      refresh: /refresh
      logout: /logout
    inventory:
      base: /inventory
      receive: /receive
      receive-batch: /receive/batch
      pick-reserve: /pick/reserve
      pick-confirm: /pick/confirm
      pick-release: /pick/release
      tasks-generate: /tasks/generate
      movements-me: /movements/me
    users:
      base: /users
      batch-permissions: /batch/permissions
  security:
    password:
      bcrypt-strength: 12
    rate-limit:
      auth-endpoints:
        - ${app.api.base-path}${app.api.auth.base}${app.api.auth.login}
        - ${app.api.base-path}${app.api.auth.base}${app.api.auth.refresh}
      user-bucket:
        capacity: 60
        refill-tokens: 60
        refill-duration: 1m
        burst-capacity: 20
        cache-duration: 10m
      ip-bucket:
        capacity: 10
        refill-tokens: 10
        refill-duration: 1m
        burst-capacity: 10
        cache-duration: 10m
    blacklist:
      cache-duration: 2h
    locks:
      reservation-ttl: 2h
      idempotency-ttl: 24h
  jobs:
    sweeper:
      cron: "0 0 * * * *"
